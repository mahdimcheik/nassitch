name: CD

on:
  push:
    branches:
      - main
      - master # branche par défaut actuelle du dépôt
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the branch
        uses: actions/checkout@v4

      # Version = sha court du commit déployé (ex. "a1b2c3d")
      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Build : deux tags sur la MÊME image — la version + latest
      - name: Build the docker image
        run: |
          docker build --target prod-runtime \
            --build-arg APP_VERSION=${{ steps.version.outputs.tag }} \
            -t mahdimcheik/nassitch-client:${{ steps.version.outputs.tag }} \
            -t mahdimcheik/nassitch-client:latest .

      - name: Push the docker image to the docker hub
        run: docker push --all-tags mahdimcheik/nassitch-client

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          # on passe la version au script via une variable d'env
          envs: IMAGE_TAG
          script: |
            cd ~/nassitch/front-end
            # met à jour UNIQUEMENT la ligne IMAGE_TAG, garde le reste du .env
            touch .env
            grep -v '^IMAGE_TAG=' .env > .env.tmp || true
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env.tmp
            mv .env.tmp .env
            docker pull mahdimcheik/nassitch-client:${IMAGE_TAG}
            docker compose up -d --force-recreate
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
