<section
  class="relative overflow-hidden rounded-2xl bg-inverse-surface p-4 text-inverse-on-surface shadow-card sm:p-5"
  aria-labelledby="lab-title"
>
  <div class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-1.5">
      <span class="size-2.5 rounded-full bg-error" aria-hidden="true"></span>
      <span class="size-2.5 rounded-full bg-secondary-container" aria-hidden="true"></span>
      <span class="size-2.5 rounded-full bg-secondary-fixed" aria-hidden="true"></span>
      <span class="ml-2 font-mono text-label-sm text-surface-variant/80">shader_node.frag</span>
    </div>
    <button
      type="button"
      [attr.aria-pressed]="boosted()"
      (click)="toggleBoost()"
      class="inline-flex min-h-11 items-center gap-1.5 rounded-lg px-3 text-label transition-colors aria-pressed:bg-secondary-fixed aria-pressed:text-on-secondary-fixed bg-surface-variant/20 text-inverse-on-surface hover:bg-surface-variant/35"
    >
      <app-icon name="play" class="text-[14px]" />
      Turbo
    </button>
  </div>

  <div class="relative mt-3 h-32 overflow-hidden rounded-xl bg-on-background sm:h-40">
    <svg
      class="size-full opacity-85"
      viewBox="0 0 300 120"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <defs>
        <linearGradient id="lab-wave" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4648d4" />
          <stop offset="50%" stop-color="#6063ee" />
          <stop offset="100%" stop-color="#6cf8bb" />
        </linearGradient>
      </defs>
      <g class="animate-drift-slow">
        <path [attr.d]="wave.back" fill="url(#lab-wave)" opacity="0.45" />
      </g>
      <g class="animate-drift-fast">
        <path [attr.d]="wave.front" fill="url(#lab-wave)" opacity="0.7" />
      </g>
    </svg>

    <div class="pointer-events-none absolute inset-0 flex flex-col justify-between p-3">
      <div class="flex items-center justify-between font-mono text-label-sm text-secondary-fixed">
        <span aria-live="polite">{{ boosted() ? '120.0' : '60.0' }} FPS</span>
        <span>WebGL 2.0</span>
      </div>
      <code class="font-mono text-code text-surface-bright/90 drop-shadow">
        vec3 col = cos(uv.xyx + vec3(0,2,4));
      </code>
    </div>
  </div>

  <div class="mt-4 flex items-end justify-between gap-3">
    <div>
      <h3 id="lab-title" class="text-title text-inverse-on-surface">
        Canevas de shaders génératifs
      </h3>
      <p class="mt-0.5 text-body-sm text-surface-variant/80">
        Micro-expériences de raymarching et de fragment shaders GLSL.
      </p>
    </div>
    <span
      class="rounded-lg bg-secondary-fixed px-2 py-1 text-label-sm uppercase text-on-secondary-fixed"
      >Labo</span
    >
  </div>
</section>
